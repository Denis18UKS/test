name: Player Bots Final CI Build v5
on:
  push:
    branches: [chatgpt-playerbots-build-20260916]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Restore exact final source tree
        shell: bash
        run: |
          set -euxo pipefail
          cat .ci/playerbots-src/chunk-* > /tmp/player-bots-final-src.b64
          base64 -d /tmp/player-bots-final-src.b64 > /tmp/player-bots-final-src.tgz
          echo '0a4d7fd86b8b17795a99db95bd2a058c5c17e80af1bde69cffad3f90863436f3  /tmp/player-bots-final-src.tgz' | sha256sum -c -
          rm -rf work
          mkdir -p work
          tar -xzf /tmp/player-bots-final-src.tgz -C work
          test -f work/src/main/java/dev/denis/playerbots/core/PossessionRouting.java
          test -f work/src/main/java/dev/denis/playerbots/mixin/EntityTrackerMixin.java
          grep -F 'EntityTrackerMixin' work/src/main/resources/playerbots.mixins.json

      - name: Run core behavior tests
        working-directory: work
        run: |
          rm -rf /tmp/playerbots-core-classes
          mkdir -p /tmp/playerbots-core-classes
          javac -d /tmp/playerbots-core-classes src/main/java/dev/denis/playerbots/core/*.java dev-tests/PlayerBotsCoreTests.java
          java -cp /tmp/playerbots-core-classes PlayerBotsCoreTests

      - name: Generate Gradle wrapper
        working-directory: work
        run: gradle wrapper --gradle-version 8.8

      - name: Build remapped Fabric jar
        working-directory: work
        run: ./gradlew --stacktrace clean build

      - name: Inspect exact jar contents
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          JAR='build/libs/player-bots-1.0.0.jar'
          test -f "$JAR"
          jar tf "$JAR" > jar-contents.txt
          grep -Fx 'fabric.mod.json' jar-contents.txt
          grep -Fx 'dev/denis/playerbots/bot/PossessionManager.class' jar-contents.txt
          grep -Fx 'dev/denis/playerbots/core/PossessionRouting.class' jar-contents.txt
          grep -Fx 'dev/denis/playerbots/mixin/EntityTrackerMixin.class' jar-contents.txt
          grep -Fx 'playerbots.mixins.json' jar-contents.txt

      - name: Dedicated server startup smoke test
        working-directory: work
        shell: bash
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          set +e
          timeout 90s ./gradlew runServer --no-daemon > server-smoke.log 2>&1
          code=$?
          set -e
          cat server-smoke.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
          grep -F 'Done (' server-smoke.log

      - name: Package sources
        working-directory: work
        shell: bash
        run: |
          zip -qr player-bots-1.0.0-sources.zip . \
            -x '.gradle/*' 'build/*' 'run/*' 'server-smoke.log' 'jar-contents.txt'
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          unzip -t player-bots-1.0.0-sources.zip

      - uses: actions/upload-artifact@v4
        with:
          name: player-bots-final-build-v5
          if-no-files-found: error
          path: |
            work/build/libs/player-bots-1.0.0.jar
            work/build/libs/player-bots-1.0.0-sources.jar
            work/player-bots-1.0.0-sources.zip
            work/server-smoke.log
            work/jar-contents.txt
