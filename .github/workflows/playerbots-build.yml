name: Player Bots CI Build
on:
  push:
    branches: [chatgpt-playerbots-build-20260916]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Restore source payload
        shell: bash
        run: |
          mkdir -p work
          echo '' | base64 -d > /tmp/playerbots-src.tgz
          tar -xzf /tmp/playerbots-src.tgz -C work
      - name: Build
        working-directory: work
        run: gradle --stacktrace build
      - name: Package sources
        working-directory: work
        run: zip -qr player-bots-1.0.0-sources.zip . -x '.gradle/*' 'build/*' '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: player-bots-build
          path: |
            work/build/libs/player-bots-1.0.0.jar
            work/build/libs/player-bots-1.0.0-sources.jar
            work/player-bots-1.0.0-sources.zip
