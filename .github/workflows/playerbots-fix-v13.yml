name: Player Bots 1.3.0 Fix
on:
  push:
    branches: [chatgpt-playerbots-fix-20261001]
    paths:
      - '.ci/playerbots-fix-v13/trigger'
      - '.ci/playerbots-fix-v13/build.sh'
      - '.ci/playerbots-fix-v13/patch.gz.b64'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build and verify Player Bots 1.3.0
        shell: bash
        run: bash .ci/playerbots-fix-v13/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: player-bots-1.3.0-final
          if-no-files-found: error
          path: |
            work/build/libs/player-bots-1.3.0.jar
            work/build/libs/player-bots-1.3.0-sources.jar
            work/player-bots-1.3.0-sources.zip
            work/server-player-count.log
            work/client-smoke.log
            work/jar-contents.txt
            work/built-mixins.json
            work/SHA256SUMS.txt
