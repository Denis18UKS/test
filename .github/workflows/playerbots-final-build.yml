diff --git a/src/main/java/dev/denis/playerbots/core/PossessionRouting.java b/src/main/java/dev/denis/playerbots/core/PossessionRouting.java
new file mode 100644
index 0000000..16bc599
--- /dev/null
+++ b/src/main/java/dev/denis/playerbots/core/PossessionRouting.java
@@ -0,0 +1,20 @@
+package dev.denis.playerbots.core;
+
+import java.util.Map;
+import java.util.Objects;
+import java.util.UUID;
+
+public final class PossessionRouting {
+    private PossessionRouting() {}
+
+    public static boolean shouldSuppressTracking(UUID trackedEntityId, UUID recipientId,
+                                                 Map<UUID, UUID> controllerByControlled) {
+        if (trackedEntityId == null || recipientId == null || controllerByControlled == null) return false;
+        UUID controllerId = controllerByControlled.get(recipientId);
+        return trackedEntityId.equals(controllerId);
+    }
+
+    public static boolean needsWorldBridge(String currentDimensionId, String targetDimensionId) {
+        return !Objects.equals(currentDimensionId, targetDimensionId);
+    }
+}
diff --git a/src/main/java/dev/denis/playerbots/mixin/EntityTrackerMixin.java b/src/main/java/dev/denis/playerbots/mixin/EntityTrackerMixin.java
new file mode 100644
index 0000000..2364aa8
--- /dev/null
+++ b/src/main/java/dev/denis/playerbots/mixin/EntityTrackerMixin.java
@@ -0,0 +1,28 @@
+package dev.denis.playerbots.mixin;
+
+import dev.denis.playerbots.PlayerBotsMod;
+import net.minecraft.entity.Entity;
+import net.minecraft.server.network.ServerPlayerEntity;
+import org.spongepowered.asm.mixin.Final;
+import org.spongepowered.asm.mixin.Mixin;
+import org.spongepowered.asm.mixin.Shadow;
+import org.spongepowered.asm.mixin.injection.At;
+import org.spongepowered.asm.mixin.injection.Inject;
+import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
+
+@Mixin(targets = "net.minecraft.server.world.ThreadedAnvilChunkStorage$EntityTracker")
+public abstract class EntityTrackerMixin {
+    @Shadow @Final Entity entity;
+
+    @Inject(
+            method = "updateTrackedStatus(Lnet/minecraft/server/network/ServerPlayerEntity;)V",
+            at = @At("HEAD"),
+            cancellable = true
+    )
+    private void playerbots$hideControllerBodyFromPossessedClient(ServerPlayerEntity player, CallbackInfo ci) {
+        if (PlayerBotsMod.manager() != null
+                && PlayerBotsMod.manager().possession().shouldSuppressTracking(entity, player)) {
+            ci.cancel();
+        }
+    }
+}
