name: Player Bots Final CI Build
on:
  push:
    branches: [chatgpt-playerbots-build-20260916]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Restore previously verified source snapshot
        shell: bash
        run: |
          mkdir -p work
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, tarfile
          workflow = Path('.github/workflows/playerbots-build.yml').read_text()
          match = re.search(r"echo '([^']+)' \\| base64 -d", workflow)
          if not match:
              raise SystemExit('Could not locate baseline source payload')
          archive = Path('/tmp/playerbots-src.tgz')
          archive.write_bytes(base64.b64decode(match.group(1)))
          with tarfile.open(archive, 'r:gz') as tf:
              tf.extractall('work')
          PY

      - name: Apply final possession hardening
        shell: bash
        run: |
          cat > /tmp/playerbots-final.patch <<'PATCH'
diff --git a/dev-tests/PlayerBotsCoreTests.java b/dev-tests/PlayerBotsCoreTests.java
