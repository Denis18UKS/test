PATCH
          cd work
          git apply /tmp/playerbots-final.patch

      - name: Run core behavior tests
        working-directory: work
        run: |
          rm -rf /tmp/playerbots-core-classes
          mkdir -p /tmp/playerbots-core-classes
          javac -d /tmp/playerbots-core-classes src/main/java/dev/denis/playerbots/core/*.java dev-tests/PlayerBotsCoreTests.java
          java -cp /tmp/playerbots-core-classes PlayerBotsCoreTests

      - name: Generate Gradle wrapper
        working-directory: work
        run: gradle wrapper --gradle-version 8.8

      - name: Build remapped Fabric jar
        working-directory: work
        run: ./gradlew --stacktrace clean build

      - name: Inspect jar contents
        working-directory: work
        run: |
          test -f build/libs/player-bots-1.0.0.jar
          jar tf build/libs/player-bots-1.0.0.jar | grep -q '^fabric.mod.json$'
          jar tf build/libs/player-bots-1.0.0.jar | grep -q 'dev/denis/playerbots/bot/PossessionManager.class'
          jar tf build/libs/player-bots-1.0.0.jar | grep -q 'dev/denis/playerbots/mixin/EntityTrackerMixin.class'
          jar tf build/libs/player-bots-1.0.0.jar | grep -q '^playerbots.mixins.json$'

      - name: Dedicated server startup smoke test
        working-directory: work
        shell: bash
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          set +e
          timeout 45s ./gradlew runServer --no-daemon > server-smoke.log 2>&1
          code=$?
          set -e
          cat server-smoke.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
          grep -q 'Done (' server-smoke.log

      - name: Package sources
        working-directory: work
        run: zip -qr player-bots-1.0.0-sources.zip . -x '.gradle/*' 'build/*' 'run/*' 'server-smoke.log'

      - uses: actions/upload-artifact@v4
        with:
          name: player-bots-final-build
          if-no-files-found: error
          path: |
            work/build/libs/player-bots-1.0.0.jar
            work/build/libs/player-bots-1.0.0-sources.jar
            work/player-bots-1.0.0-sources.zip
