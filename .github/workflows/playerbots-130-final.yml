name: Player Bots 1.3.0 Final
on:
  push:
    branches: [chatgpt-playerbots-build-20260916]
    paths:
      - '.ci/playerbots130/trigger-final'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Restore verified 1.2.0 base and apply 1.3.0 fixes
        shell: bash
        run: |
          set -euxo pipefail
          cat .ci/playerbots-src/chunk-* | base64 -d > /tmp/base.tgz
          echo '0a4d7fd86b8b17795a99db95bd2a058c5c17e80af1bde69cffad3f90863436f3  /tmp/base.tgz' | sha256sum -c -
          rm -rf work && mkdir work
          tar -xzf /tmp/base.tgz -C work

          cat .ci/playerbots-v11-overlay/part-* | base64 -d > /tmp/playerbots110-overlay.tgz
          echo 'e07e5a01094b8eb3bc8a11917f34437d49a851322d8202de9f4fa15910ff9822  /tmp/playerbots110-overlay.tgz' | sha256sum -c -
          tar -xzf /tmp/playerbots110-overlay.tgz -C work

          rm -f work/src/main/java/dev/denis/playerbots/client/PossessedBodyVisual.java
          rm -f work/src/main/java/dev/denis/playerbots/mixin/EntityTrackerMixin.java
          rm -f work/src/main/java/dev/denis/playerbots/mixin/ServerPlayNetworkHandlerAccessor.java
          rm -f work/src/main/java/dev/denis/playerbots/mixin/ClientPlayerInteractionManagerMixin.java

          cp .ci/playerbots120/PlayerBotsClient.java work/src/main/java/dev/denis/playerbots/client/PlayerBotsClient.java
          cp .ci/playerbots120/BotRadialScreen.java work/src/main/java/dev/denis/playerbots/client/screen/BotRadialScreen.java
          cp .ci/playerbots120/BotConnection.java work/src/main/java/dev/denis/playerbots/bot/BotConnection.java
          cp .ci/playerbots120/PossessionManager.java work/src/main/java/dev/denis/playerbots/bot/PossessionManager.java
          cp .ci/playerbots120/PlayerBotsMod.java work/src/main/java/dev/denis/playerbots/PlayerBotsMod.java
          cp .ci/playerbots120/playerbots.mixins.json work/src/main/resources/playerbots.mixins.json
          sed -i 's/BotConnection connection = new BotConnection();/BotConnection connection = new BotConnection(server, id);/' work/src/main/java/dev/denis/playerbots/bot/BotManager.java
          sed -i 's/mod_version=1.1.0/mod_version=1.2.0/' work/gradle.properties

          cp .ci/playerbots130/PlayerBotsClient.java work/src/main/java/dev/denis/playerbots/client/PlayerBotsClient.java
          cp .ci/playerbots130/BotInputController.java work/src/main/java/dev/denis/playerbots/client/BotInputController.java
          cp .ci/playerbots130/BotInventoryMirror.java work/src/main/java/dev/denis/playerbots/client/BotInventoryMirror.java
          cp .ci/playerbots130/BotInventoryScreen.java work/src/main/java/dev/denis/playerbots/client/screen/BotInventoryScreen.java
          cp .ci/playerbots130/BotRadialScreen.java work/src/main/java/dev/denis/playerbots/client/screen/BotRadialScreen.java
          cp .ci/playerbots130/MinecraftClientMixin.java work/src/main/java/dev/denis/playerbots/mixin/MinecraftClientMixin.java
          cp .ci/playerbots130/ServerPlayNetworkHandlerMixin.java work/src/main/java/dev/denis/playerbots/mixin/ServerPlayNetworkHandlerMixin.java
          cp .ci/playerbots130/PlayerBotsNetworking.java work/src/main/java/dev/denis/playerbots/network/PlayerBotsNetworking.java
          sed -i 's/mod_version=1.2.0/mod_version=1.3.0/' work/gradle.properties

          grep -Fx 'mod_version=1.3.0' work/gradle.properties
          test -f work/src/main/java/dev/denis/playerbots/client/screen/BotInventoryScreen.java
          grep -F 'radialKey.wasPressed()' work/src/main/java/dev/denis/playerbots/client/PlayerBotsClient.java
          ! grep -Fq 'radialKey.isPressed()' work/src/main/java/dev/denis/playerbots/client/PlayerBotsClient.java
          grep -F 'new PlayerInputC2SPacket' work/src/main/java/dev/denis/playerbots/network/PlayerBotsNetworking.java

      - name: Regression checks
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          grep -F 'BotInventoryScreen' src/main/java/dev/denis/playerbots/mixin/MinecraftClientMixin.java
          grep -F 'ClientBotState.controlled()' src/main/java/dev/denis/playerbots/client/screen/BotInventoryScreen.java
          grep -F 'BotInputController.clickInventory' src/main/java/dev/denis/playerbots/client/screen/BotInventoryScreen.java
          grep -F 'BOT_INVENTORY_CLICK' src/main/java/dev/denis/playerbots/network/PlayerBotsNetworking.java
          grep -F 'packet.apply(bot.networkHandler)' src/main/java/dev/denis/playerbots/mixin/ServerPlayNetworkHandlerMixin.java
          grep -F 'client.player.setVelocity(Vec3d.ZERO)' src/main/java/dev/denis/playerbots/client/BotInputController.java
          grep -F 'client.currentScreen instanceof BotRadialScreen' src/main/java/dev/denis/playerbots/client/PlayerBotsClient.java
          grep -F 'button == 0' src/main/java/dev/denis/playerbots/client/screen/BotRadialScreen.java
          grep -F 'ClientBotState.control(entry.bot.uuid())' src/main/java/dev/denis/playerbots/client/screen/BotRadialScreen.java
          grep -F 'for (int slot = 1; slot <= 4; slot++) out.writeItemStack' src/main/java/dev/denis/playerbots/network/PlayerBotsNetworking.java
          ! grep -Fq 'ClientPlayerInteractionManagerMixin' src/main/resources/playerbots.mixins.json
          test ! -f src/main/java/dev/denis/playerbots/mixin/ClientPlayerInteractionManagerMixin.java
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          mirror=(root/'src/main/java/dev/denis/playerbots/client/BotInventoryMirror.java').read_text()
          assert 'client.player.getInventory()' not in mirror
          assert 'applyState(client, state)' not in mirror
          print('AUTHORITATIVE INVENTORY CHECK PASSED')
          PY
          for t in dev-tests/test_fake_player_lifecycle.py dev-tests/test_first_person_possession.py dev-tests/test_minigame_player_count.py dev-tests/test_possession_identity.py dev-tests/test_real_body_anchor.py; do python3 "$t"; done
          rm -rf /tmp/pbcore && mkdir /tmp/pbcore
          javac -d /tmp/pbcore src/main/java/dev/denis/playerbots/core/*.java dev-tests/PlayerBotsCoreTests.java
          java -cp /tmp/pbcore PlayerBotsCoreTests

      - name: Build remapped Fabric jar
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          gradle wrapper --gradle-version 8.8
          ./gradlew --stacktrace clean build

      - name: Inspect final jar
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          JAR=build/libs/player-bots-1.3.0.jar
          test -f "$JAR"
          jar tf "$JAR" > jar-contents.txt
          for cls in dev/denis/playerbots/bot/BotConnection.class dev/denis/playerbots/bot/BotManager.class dev/denis/playerbots/bot/PossessionManager.class dev/denis/playerbots/client/BotInputController.class dev/denis/playerbots/client/BotInventoryMirror.class dev/denis/playerbots/client/screen/BotInventoryScreen.class dev/denis/playerbots/mixin/ClientConnectionAccessor.class dev/denis/playerbots/mixin/ServerPlayNetworkHandlerMixin.class; do grep -Fx "$cls" jar-contents.txt; done
          ! grep -Fq 'ClientPlayerInteractionManagerMixin.class' jar-contents.txt
          ! grep -Fq 'PossessedBodyVisual.class' jar-contents.txt
          ! grep -Fq 'EntityTrackerMixin.class' jar-contents.txt
          unzip -p "$JAR" playerbots.mixins.json > built-mixins.json

      - name: Vanilla player-count integration
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p run
          echo eula=true > run/eula.txt
          rm -f /tmp/pb130-cmd
          mkfifo /tmp/pb130-cmd
          exec 3<>/tmp/pb130-cmd
          ./gradlew runServer --no-daemon < /tmp/pb130-cmd > server-player-count.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 240); do grep -Fq 'Done (' server-player-count.log && break; kill -0 "$PID"; sleep 0.5; done
          grep -F 'Done (' server-player-count.log
          echo 'bot create BotOne' >&3
          sleep 2
          echo 'list' >&3
          for i in $(seq 1 40); do grep -Eq 'There are 1 of a max of [0-9]+ players online:.*BotOne' server-player-count.log && break; sleep 0.5; done
          grep -E 'There are 1 of a max of [0-9]+ players online:.*BotOne' server-player-count.log
          echo 'bot create BotTwo' >&3
          sleep 2
          echo 'list' >&3
          for i in $(seq 1 40); do grep -Eq 'There are 2 of a max of [0-9]+ players online:.*Bot(One|Two).*Bot(One|Two)' server-player-count.log && break; sleep 0.5; done
          grep -E 'There are 2 of a max of [0-9]+ players online:.*Bot(One|Two).*Bot(One|Two)' server-player-count.log
          ! grep -Fq 'Duplicate entity UUID' server-player-count.log
          ! grep -Fq 'Failed to validate profile key' server-player-count.log
          echo stop >&3
          wait "$PID"
          trap - EXIT

      - name: Client startup smoke
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a ./gradlew runClient --no-daemon > client-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then cat client-smoke.log; exit "$code"; fi
          ! grep -Eq 'Mixin apply failed|InjectionError|InvalidMixinException|NoSuchMethodError|NoSuchFieldError|ClassCastException' client-smoke.log
          grep -F 'Setting user:' client-smoke.log

      - name: Package verified release
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          zip -qr player-bots-1.3.0-sources-ci.zip . -x '.gradle/*' 'build/*' 'run/*' 'server-player-count.log' 'client-smoke.log' 'jar-contents.txt' 'built-mixins.json' 'SHA256SUMS.txt'
          unzip -t player-bots-1.3.0-sources-ci.zip
          sha256sum build/libs/player-bots-1.3.0.jar player-bots-1.3.0-sources-ci.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: player-bots-1.3.0-final
          if-no-files-found: error
          path: |
            work/build/libs/player-bots-1.3.0.jar
            work/build/libs/player-bots-1.3.0-sources.jar
            work/player-bots-1.3.0-sources-ci.zip
            work/server-player-count.log
            work/client-smoke.log
            work/jar-contents.txt
            work/built-mixins.json
            work/SHA256SUMS.txt
