plugins {
    id 'com.android.application'
}

android {
    namespace 'com.puzzlescan.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.puzzlescan.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        // Real phones are ARM. Excluding emulator-only x86 ABIs keeps the APK much smaller.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'org.opencv:opencv:4.12.0'
}
